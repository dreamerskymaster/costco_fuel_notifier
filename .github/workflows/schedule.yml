name: Daily Gas Price Tracker

on:
  schedule:
    # Routine corridor price monitoring every 3 hours
    - cron: '0 */3 * * *'
    # Friday 4:00 PM EDT (20:00 UTC) — Pre-departure alert from Norwalk to 850 Westside Ave, Jersey City
    - cron: '0 20 * * 5'
    # Sunday 3:00 PM EDT (19:00 UTC) — Pre-return alert from Jersey City back to Norwalk
    - cron: '0 19 * * 0'

  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Inject Service Account JSON
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: echo "$GCP_SERVICE_ACCOUNT" > service_account.json

      - name: Run Gas Tracker
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: python gas_tracker.py


