name: INR-USD Credila Transfer Brief

on:
  schedule:
    # Daily check at ~09:23 America/New_York (EDT). The script emails only when
    # the send window opens, two days before it closes, or on the weekly day —
    # so this is a cheap poll, not a daily email.
    - cron: '23 13 * * *'

  workflow_dispatch:
    inputs:
      force:
        description: 'Email the brief now regardless of schedule'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # Shared with the USD-INR workflows: all of them commit to data/.
  group: usd-inr-notifier
  cancel-in-progress: false

jobs:
  run-inr-usd-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore price cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: usd-inr-cache-${{ github.run_id }}
          restore-keys: usd-inr-cache-

      - name: Run INR-USD Brief
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          # Deliberately no fallback to RECEIVER_EMAIL: this brief is someone else's.
          INR_USD_RECEIVER_EMAIL: ${{ secrets.INR_USD_RECEIVER_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          INR_USD_AMOUNT: ${{ vars.INR_USD_AMOUNT }}
          INR_USD_WINDOW_START: ${{ vars.INR_USD_WINDOW_START }}
          INR_USD_FLEX_DAYS: ${{ vars.INR_USD_FLEX_DAYS }}
          INR_USD_DIGEST_WEEKDAY: ${{ vars.INR_USD_DIGEST_WEEKDAY }}
          WIRE_MARKUP_PCT: ${{ vars.WIRE_MARKUP_PCT }}
          WIRE_OUR_FEE_INR: ${{ vars.WIRE_OUR_FEE_INR }}
          WIRE_CORRESPONDENT_USD: ${{ vars.WIRE_CORRESPONDENT_USD }}
          CHASE_INCOMING_WIRE_USD: ${{ vars.CHASE_INCOMING_WIRE_USD }}
          WIRE_RECEIPT: ${{ vars.WIRE_RECEIPT }}
          GLOBALPAY_MARKUP_PCT: ${{ vars.GLOBALPAY_MARKUP_PCT }}
          GLOBALPAY_FEE_INR: ${{ vars.GLOBALPAY_FEE_INR }}
          GLOBALPAY_CORRESPONDENT_USD: ${{ vars.GLOBALPAY_CORRESPONDENT_USD }}
          GLOBALPAY_RECEIPT: ${{ vars.GLOBALPAY_RECEIPT }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python inr_usd_tracker.py --mode force
          else
            python inr_usd_tracker.py --mode digest
          fi

      - name: Commit transfer history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inr_usd_history.csv data/inr_usd_state.json 2>/dev/null || true
          git diff --staged --quiet && echo "nothing to commit" && exit 0
          git commit -m "chore(data): INR/USD brief $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
