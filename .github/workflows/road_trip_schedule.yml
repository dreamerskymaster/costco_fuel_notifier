name: One-Time Road Trip Fuel Digest

# Fires every day at 00:00 UTC = 5:30 AM IST.
# The Python script (road_trip_tracker.py) checks whether today (IST) matches
# any trip date and exits silently if not, so this workflow is a no-op on non-trip days.
#
# Trip dates covered (IST):
#   2026-09-30  Mumbai -> Goa   (NH66)
#   2026-10-04  Goa    -> Mumbai (NH66)
#   2026-10-09  Mumbai -> Pune  (NH48/Expressway)
#   2026-10-10  Pune   -> Mumbai (NH48/Expressway)
#   2026-10-15  Mumbai -> Pune  (NH48/Expressway)
#   2026-10-17  Pune   -> Mumbai (NH48/Expressway)

on:
  schedule:
    # 00:00 UTC = 05:30 AM IST — fires before departure, replaces regular Mumbai digest
    - cron: '0 0 * * *'

  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  run-road-trip-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Road Trip Fuel Digest
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          MUMBAI_RECEIVER_EMAIL: ${{ secrets.MUMBAI_RECEIVER_EMAIL || secrets.RECEIVER_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: python road_trip_tracker.py
