name: Daily Mumbai Fuel Price Tracker

on:
  schedule:
    # Triggers daily at 01:30 UTC (7:00 AM IST, immediately following 6:00 AM IST fuel revisions)
    - cron: '30 1 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-mumbai-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Skip on Road Trip Days
        # On the 6 one-time trip departure dates the road_trip_schedule.yml workflow
        # already fires at 5:30 AM IST with a tailored trip email. We skip the regular
        # Mumbai digest on those mornings to avoid a duplicate email.
        run: |
          TODAY_IST=$(TZ="Asia/Kolkata" date +%Y-%m-%d)
          ROAD_TRIP_DATES="2026-09-30 2026-10-04 2026-10-09 2026-10-10 2026-10-15 2026-10-17"
          for d in $ROAD_TRIP_DATES; do
            if [ "$TODAY_IST" = "$d" ]; then
              echo "Road trip day ($TODAY_IST) -- skipping regular Mumbai digest."
              exit 0
            fi
          done
          echo "Regular digest day ($TODAY_IST) -- proceeding."

      - name: Run Mumbai Fuel Tracker
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          MUMBAI_RECEIVER_EMAIL: ${{ secrets.MUMBAI_RECEIVER_EMAIL || secrets.RECEIVER_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: python mumbai_gas_tracker.py

      - name: Commit price history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/india_fuel_history.csv 2>/dev/null || true
          git diff --staged --quiet && echo "nothing to commit" && exit 0
          git commit -m "chore(data): India fuel price history $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase --autostash origin ${{ github.ref_name }} && git push && exit 0; sleep 5; done
          exit 1
