name: Daily Mumbai Fuel Price Tracker

on:
  schedule:
    # Triggers daily at 01:30 UTC (7:00 AM IST, immediately following 6:00 AM IST fuel revisions)
    - cron: '30 1 * * *'

  workflow_dispatch:

jobs:
  run-mumbai-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Mumbai Fuel Tracker
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          MUMBAI_RECEIVER_EMAIL: ${{ secrets.MUMBAI_RECEIVER_EMAIL || secrets.RECEIVER_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: python mumbai_gas_tracker.py
